name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # The gate lives in checks.<system>.go-gate (golangci-lint, nilaway, go
      # test, go test -race), so `nix flake check` runs it too. CI builds it
      # directly: the pre-commit check evaluates the whole hook closure, which
      # the Go gate does not need.
      - run: nix build -L .#checks.x86_64-linux.go-gate
